name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install npm dependencies
        run: npm install --no-package-lock

      - name: Prepare app build metadata
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          REPO="${GITHUB_REPOSITORY}"
          sed -i "s#__APP_VERSION__#${VERSION}#g" www/app.js
          sed -i "s#__GITHUB_REPO__#${REPO}#g" www/app.js
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create Android project
        run: npx cap add android

      - name: Install Android app icons
        shell: bash
        run: |
          # Capacitor creates ic_launcher_background.xml itself.
          # Copy only our icon assets so we do not define the same color resource twice.
          cp -R resources/android/mipmap-* android/app/src/main/res/
          cp -R resources/android/drawable android/app/src/main/res/

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Copy APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "LifeSystem-${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeSystem-APK
          path: "LifeSystem-${VERSION}.apk"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${VERSION}"
          name: "Life System v${VERSION}"
          body: |
            自动构建的 Android APK。

            Commit: ${{ github.sha }}
            Run: #${{ github.run_number }}
          files: "LifeSystem-${{ env.VERSION }}.apk"
          overwrite_files: true
          fail_on_unmatched_files: true
