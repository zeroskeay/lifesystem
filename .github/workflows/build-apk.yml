name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install npm dependencies
        run: npm install --no-package-lock

      - name: Prepare app build metadata
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s#__APP_VERSION__#${VERSION}#g" www/app.js
          sed -i "s#__APP_VERSION__#${VERSION}#g" www/index.html
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Add native file export runtime
        shell: bash
        run: |
          mkdir -p www/vendor
          cp node_modules/@capacitor/core/dist/capacitor.js www/vendor/capacitor.js
          cp node_modules/@capacitor/synapse/dist/synapse.js www/vendor/synapse.js
          cp node_modules/@capacitor/filesystem/dist/plugin.js www/vendor/filesystem.js
          npx cap sync android

      - name: Install Android app icons
        shell: bash
        run: |
          # Install custom icons after Capacitor sync so generated defaults
          # cannot overwrite the app icon resources.
          find android/app/src/main/res -type f -name 'ic_launcher_foreground.*' -delete
          cp -R resources/android/mipmap-* android/app/src/main/res/
          cp -R resources/android/drawable android/app/src/main/res/
          cp resources/android/values/life_system_icon_colors.xml android/app/src/main/res/values/
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/drawable/ic_launcher_foreground.png
          test -f android/app/src/main/res/values/life_system_icon_colors.xml

      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
          python3 - <<'PY'
          import re
          from pathlib import Path

          build_file = Path("android/app/build.gradle")
          text = build_file.read_text()
          signing = """    signingConfigs {
                  release {
                      storeFile file("../release-keystore.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """
          if "signingConfigs {" not in text:
              text = text.replace("    buildTypes {", signing + "    buildTypes {", 1)
          text = re.sub(
              r"(?m)^(\s*)versionCode\s+.*$",
              r'\1versionCode project.hasProperty("versionCode") ? project.versionCode.toInteger() : 1',
              text,
              count=1,
          )
          text = re.sub(
              r"(?m)^(\s*)versionName\s+.*$",
              r'\1versionName project.hasProperty("versionName") ? project.versionName : "1.0"',
              text,
              count=1,
          )
          text = re.sub(
              r"(?m)^(\s*buildTypes\s*\{\s*\n\s*release\s*\{\s*)$",
              r"\1\n            signingConfig signingConfigs.release",
              text,
              count=1,
          )
          build_file.write_text(text)
          PY

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --stacktrace \
            -PversionCode="${{ github.run_number }}" \
            -PversionName="${{ env.VERSION }}" \
            assembleRelease

      - name: Copy APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "LifeSystem-${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeSystem-APK
          path: "LifeSystem-${{ env.VERSION }}.apk"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "Life System v${{ env.VERSION }}"
          body: |
            自动构建的 Android APK。

            Commit: ${{ github.sha }}
            Run: #${{ github.run_number }}
          files: "LifeSystem-${{ env.VERSION }}.apk"
          overwrite_files: true
          fail_on_unmatched_files: true
