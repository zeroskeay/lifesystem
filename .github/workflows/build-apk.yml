name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install npm dependencies
        run: npm install --no-package-lock

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Copy APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "LifeSystem-${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeSystem-APK
          path: "LifeSystem-${{ github.run_number }}.apk"

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "Life System v${{ steps.version.outputs.version }}"
          body: |
            自动构建的 Android APK。

            Commit: ${{ github.sha }}
            Run: #${{ github.run_number }}
          files: "LifeSystem-${{ github.run_number }}.apk"
          overwrite_files: true
          fail_on_unmatched_files: true
