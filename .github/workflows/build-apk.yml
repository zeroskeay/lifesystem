name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare app build metadata
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          REPO="${GITHUB_REPOSITORY}"
          sed -i "s#__APP_VERSION__#${VERSION}#g" www/app.js
          sed -i "s#__GITHUB_REPO__#${REPO}#g" www/app.js
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=v${VERSION}" >> "$GITHUB_ENV"
          fi
          test -f www/index.html
          test -f www/style.css
          test -f www/app.js

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Install Life System launcher icons
        shell: bash
        run: |
          cp -R resources/android/mipmap-* android/app/src/main/res/
          cp -R resources/android/drawable android/app/src/main/res/
          cp -R resources/android/values/*.xml android/app/src/main/res/values/

      - name: Verify launcher resources
        shell: bash
        run: |
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/drawable/ic_launcher_foreground.png
          test -f android/app/src/main/res/values/life_system_icon_colors.xml

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --warning-mode all assembleDebug

      - name: Copy APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "LifeSystem-${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeSystem-APK
          path: "LifeSystem-${VERSION}.apk"

      - name: Create or update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ env.RELEASE_TAG }}"
          name: "Life System ${{ env.RELEASE_TAG }}"
          body: |
            生活系统 Android APK。
            版本：v${{ env.VERSION }}
            Commit: ${{ github.sha }}
            Run: #${{ github.run_number }}
          files: "LifeSystem-${{ env.VERSION }}.apk"
          overwrite_files: true
          fail_on_unmatched_files: true
