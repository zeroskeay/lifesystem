<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <title>生活系统</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<header class="topbar"><div><div class="eyebrow">LIFE SYSTEM</div><h1>今天</h1></div><button id="todayBtn" class="icon-btn">⌂</button></header>
<section class="date-row"><button id="prevDay" class="day-btn">‹</button><div id="dateLabel"></div><button id="nextDay" class="day-btn">›</button></section>
<section class="card">
<div class="section-title"><span>今天的基本状态</span><span id="completion">0 / 5</span></div>
<div class="checks">
<button class="check-item" data-key="sleep"><span class="dot"></span><span><b>睡眠</b><small>昨晚休息得怎么样</small></span></button>
<button class="check-item" data-key="body"><span class="dot"></span><span><b>身体</b><small>今天有活动身体</small></span></button>
<button class="check-item" data-key="task"><span class="dot"></span><span><b>主要任务</b><small>完成了一件重要的事</small></span></button>
<button class="check-item" data-key="life"><span class="dot"></span><span><b>主动生活</b><small>主动做了一件想做的事</small></span></button>
<button class="check-item" data-key="entertainment"><span class="dot"></span><span><b>娱乐</b><small>娱乐是主动选择，而非失控消耗</small></span></button>
</div></section>
<section class="card experience-card"><div class="section-title"><span>今日体验</span><strong id="scoreValue">7</strong></div><input id="score" type="range" min="0" max="10" value="7"><div class="scale"><span>0 很差</span><span>10 很好</span></div></section>
<section class="card"><div class="section-title"><span>今天做了什么？</span></div><textarea id="note" maxlength="300" placeholder="记下一两句话就够了……"></textarea></section>
<button id="saveBtn" class="save-btn">保存今天</button>
<section class="summary"><div class="summary-title">最近 7 天</div><div id="weekSummary" class="week-summary"></div><div class="stats"><div><strong id="avgScore">—</strong><small>平均体验</small></div><div><strong id="activeDays">0</strong><small>主动生活</small></div><div><strong id="stableDays">0</strong><small>基本稳定</small></div></div></section>
<footer><span>稳 · 活 · 进 · 选</span><span>数据只保存在本机</span></footer>
</main>
<script src="app.js"></script>
</body>
</html>
